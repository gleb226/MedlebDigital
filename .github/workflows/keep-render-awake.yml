name: Keep Render awake

on:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Request the health endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          test -n "$RENDER_URL"
          curl --fail --silent --show-error --max-time 30 "$RENDER_URL/healthz"
